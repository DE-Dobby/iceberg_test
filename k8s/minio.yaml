# ──────────────────────────────────────────────────────────────────────────────
# MinIO 단일 노드 배포 (테스트용)
# 프로덕션에서는 MinIO Operator 또는 외부 클러스터 사용 권장
# ──────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: spark-test
type: Opaque
stringData:
  accessKey: minioadmin
  secretKey: minioadmin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: spark-test
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretKey
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          emptyDir: {}   # 테스트용. 영구 보존 시 PersistentVolumeClaim 으로 교체

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: spark-test
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
# MinIO 버킷 초기화 Job (mc 사용)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: spark-test
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://minio:9000/minio/health/ready; do
                echo "MinIO 준비 대기 중..."
                sleep 3
              done
              echo "MinIO 준비 완료"
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-01-16T16-06-34Z
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretKey
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio:9000 $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
              mc mb --ignore-existing local/spark-test
              echo "버킷 'spark-test' 생성 완료"
              mc ls local/
